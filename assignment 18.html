<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Assignment 18 - Student Admission Page</title>
</head>

<body>

    <header>
        <table width="100%" bgcolor="#1a237e" cellpadding="15">
            <tr>
                <td align="center">
                    <font color="white">
                        <h1>ABC College Admission 2026</h1>
                    </font>
                </td>
            </tr>
        </table>
    </header>
    <main>
        <h2>Courses and Fees</h2>
        <table border="1" cellspacing="0" cellpadding="8" width="80%">
            <caption><b>Available Courses</b></caption>
            <tr bgcolor="#e0e0e0">
                <th>Course</th>
                <th>Seats</th>
                <th>Fees</th>
            </tr>
            <tr>
                <td>B.Tech CSE</td>
                <td>120</td>
                <td>&#8377;90,000</td>
            </tr>
            <tr>
                <td>BCA</td>
                <td>60</td>
                <td>&#8377;45,000</td>
            </tr>
        </table>
        <br>
        <form action="submit.php" method="post">
            <fieldset>
                <legend>Application Form</legend>

                <label for="name">Name:</label><br>
                <input type="text" id="name" name="name" required><br><br>

                <label for="email">Email:</label><br>
                <input type="email" id="email" name="email" required><br><br>

                <label for="course">Course:</label><br>
                <select id="course" name="course" required>
                    <option value="btech" selected>B.Tech CSE</option>
                    <option value="bca">BCA</option>
                </select><br><br>

                <label for="statement">Statement:</label><br>
                <textarea id="statement" name="statement" rows="4" cols="45" required></textarea><br><br>

                <button type="submit">Apply</button>
            </fieldset>
        </form>
    </main>
    <br>
    <footer>
        <table width="100%" bgcolor="#1a237e" cellpadding="10">
            <tr>
                <td align="center">
                    <font color="white">&copy; 2026 ABC College</font>
                </td>
            </tr>
        </table>
    </footer>

</body>

</html>
